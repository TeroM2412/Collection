    /* Match the homepage */
:root {
  --background: #fafaf7;

  --green: #008000;
  --border: #d8d8d2;
}

* {
  box-sizing: border-box;
}

body {
  width: min(1320px, calc(100% - 48px));
  margin: 0 auto;
  padding: 58px 0 52px;
  background: var(--background);
  color: var(--text);
  font: 12px Arial, Helvetica, sans-serif;
}

a {
  color: var(--green);
}

h1 {
  width: fit-content;
  max-width: 100%;
  margin: 24px auto 54px;
  padding: 4px 18px;
  border: 1px solid var(--border);
  color: var(--red);
  font-size: 1.05rem;
  font-weight: 400;
}

/* Keep the gallery previews */
.gallery {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 30px 16px;
}

.photo {
  max-width: 100%;
  padding: 7px 18px 8px;
  border: 1px solid var(--border);
  background: transparent;
}

.photo img {
  display: block;
  width: 250px;
  max-width: 100%;
  height: auto;
  margin-top: 6px;
}

@media (max-width: 620px) {

  }
